name: Build AmneziaWG for ImmortalWrt R3S

on:
  workflow_dispatch:
    inputs:
      awg_ref:
        description: "2Grey/awg-openwrt branch, tag or commit"
        required: false
        default: "master"

  push:
    paths:
      - ".github/workflows/build.yml"

env:
  IMMORTAL_VERSION: "24.10.6"
  TARGET: "rockchip"
  SUBTARGET: "armv8"

  SDK_FILE: "immortalwrt-sdk-24.10.6-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  SDK_SHA256: "f467c5053592de610bb8b4d3a0ee9b1e883be84b6c2864aa5ee571b4fdccbe03"

  SDK_BASE_URL: "https://downloads.immortalwrt.org/releases/24.10.6/targets/rockchip/armv8"
  AWG_REPO: "https://github.com/2Grey/awg-openwrt.git"

jobs:
  build:
    name: Build AWG packages
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------
      # 1. Checkout нашего wrapper-репозитория
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Зависимости GitHub runner
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            swig \
            rsync \
            unzip \
            file \
            wget \
            curl \
            zstd

      # ------------------------------------------------------------
      # 3. Скачиваем именно официальный SDK ImmortalWrt 24.10.6
      # ------------------------------------------------------------
      - name: Download official ImmortalWrt SDK
        run: |
          set -eux

          wget \
            --progress=dot:giga \
            -O "$SDK_FILE" \
            "$SDK_BASE_URL/$SDK_FILE"

          echo
          echo "=== VERIFY SDK SHA256 ==="

          echo "$SDK_SHA256  $SDK_FILE" | sha256sum -c -

      # ------------------------------------------------------------
      # 4. Распаковка SDK
      # ------------------------------------------------------------
      - name: Extract SDK
        run: |
          set -eux

          mkdir -p sdk

          tar \
            --zstd \
            -xf "$SDK_FILE" \
            --strip-components=1 \
            -C sdk

          echo
          echo "=== SDK ROOT ==="

          ls -la sdk | head -100

          echo
          echo "=== SDK VERSION INFO ==="

          if [ -f sdk/include/version.mk ]; then
            grep -E \
              'VERSION_NUMBER|VERSION_CODE|VERSION_REPO' \
              sdk/include/version.mk || true
          fi

      # ------------------------------------------------------------
      # 5. Берём актуальный upstream AWG
      # ------------------------------------------------------------
      - name: Clone AWG upstream
        run: |
          set -eux

          REF="${{ inputs.awg_ref }}"

          if [ -z "$REF" ]; then
            REF="master"
          fi

          git clone "$AWG_REPO" awg-upstream

          cd awg-upstream

          git fetch --all --tags

          git checkout "$REF"

          echo
          echo "=== AWG COMMIT ==="

          git rev-parse HEAD | tee ../awg-upstream-commit.txt

          echo
          echo "=== AWG STATUS ==="

          git status --short

      # ------------------------------------------------------------
      # 6. Проверяем структуру upstream
      # ------------------------------------------------------------
      - name: Inspect AWG source tree
        run: |
          set -eux

          echo "=== UPSTREAM ROOT ==="

          ls -la awg-upstream

          echo
          echo "=== PACKAGE MAKEFILES ==="

          find awg-upstream \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            -print | sort

          echo
          echo "=== EXPECTED PACKAGES ==="

          for pkg in \
            kmod-amneziawg \
            amneziawg-tools \
            luci-proto-amneziawg
          do
            if [ ! -d "awg-upstream/$pkg" ]; then
              echo "ERROR: awg-upstream/$pkg not found"
              exit 1
            fi

            echo "FOUND: $pkg"
          done

      # ------------------------------------------------------------
      # 7. Подкладываем AWG packages в официальный SDK
      # ------------------------------------------------------------
      - name: Add AWG packages to SDK
        run: |
          set -eux

          mkdir -p sdk/package/amneziawg

          cp -a \
            awg-upstream/kmod-amneziawg \
            sdk/package/amneziawg/

          cp -a \
            awg-upstream/amneziawg-tools \
            sdk/package/amneziawg/

          cp -a \
            awg-upstream/luci-proto-amneziawg \
            sdk/package/amneziawg/

          echo
          echo "=== COPIED PACKAGES ==="

          find sdk/package/amneziawg \
            -maxdepth 3 \
            -type f \
            -name Makefile \
            -print | sort

      # ------------------------------------------------------------
      # 8. Feeds из SDK
      # ------------------------------------------------------------
      - name: Update and install feeds
        working-directory: sdk
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # 9. Включаем только нужные AWG packages
      # ------------------------------------------------------------
      - name: Select AWG packages
        working-directory: sdk
        run: |
          set -eux

          {
            echo "CONFIG_PACKAGE_kmod-amneziawg=m"
            echo "CONFIG_PACKAGE_amneziawg-tools=m"
            echo "CONFIG_PACKAGE_luci-proto-amneziawg=m"
          } >> .config

          make defconfig

          echo
          echo "=== SELECTED AWG CONFIG ==="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-amneziawg|amneziawg-tools|luci-proto-amneziawg)=' \
            .config || true

          echo
          echo "=== TARGET CONFIG ==="

          grep -E \
            '^CONFIG_TARGET_(rockchip|rockchip_armv8)' \
            .config || true

      # ------------------------------------------------------------
      # ВАЖНО:
      # tools/install и toolchain/install здесь НЕ запускаем.
      # Это SDK, toolchain в нём уже подготовлен.
      # ------------------------------------------------------------

      # ------------------------------------------------------------
      # 10. Сборка kernel module
      # ------------------------------------------------------------
      - name: Build kmod-amneziawg
        working-directory: sdk
        run: |
          set -eux

          make \
            package/amneziawg/kmod-amneziawg/compile \
            -j"$(nproc)" \
            V=s

      # ------------------------------------------------------------
      # 11. Сборка userspace tools
      # ------------------------------------------------------------
      - name: Build amneziawg-tools
        working-directory: sdk
        run: |
          set -eux

          make \
            package/amneziawg/amneziawg-tools/compile \
            -j"$(nproc)" \
            V=s

      # ------------------------------------------------------------
      # 12. Сборка LuCI protocol
      # ------------------------------------------------------------
      - name: Build luci-proto-amneziawg
        working-directory: sdk
        run: |
          set -eux

          make \
            package/amneziawg/luci-proto-amneziawg/compile \
            -j"$(nproc)" \
            V=s

      # ------------------------------------------------------------
      # 13. Собираем результаты в artifacts/
      # ------------------------------------------------------------
      - name: Collect produced packages
        run: |
          set -eux

          rm -rf artifacts
          mkdir -p artifacts

          echo "=== ALL AWG PACKAGES IN SDK ==="

          find sdk/bin \
            -type f \
            \( \
              -name 'kmod-amneziawg*.ipk' \
              -o -name 'amneziawg-tools*.ipk' \
              -o -name 'luci-proto-amneziawg*.ipk' \
              -o -name 'kmod-amneziawg*.apk' \
              -o -name 'amneziawg-tools*.apk' \
              -o -name 'luci-proto-amneziawg*.apk' \
            \) \
            -print

          echo
          echo "=== COPY ==="

          find sdk/bin \
            -type f \
            \( \
              -name 'kmod-amneziawg*.ipk' \
              -o -name 'amneziawg-tools*.ipk' \
              -o -name 'luci-proto-amneziawg*.ipk' \
              -o -name 'kmod-amneziawg*.apk' \
              -o -name 'amneziawg-tools*.apk' \
              -o -name 'luci-proto-amneziawg*.apk' \
            \) \
            -exec cp -v {} artifacts/ \;

          echo
          echo "=== ARTIFACT DIRECTORY ==="

          ls -lh artifacts

      # ------------------------------------------------------------
      # 14. Проверяем, что ВСЕ 3 пакета реально получены
      # ------------------------------------------------------------
      - name: Verify required packages
        run: |
          set -eux

          echo "=== VERIFY KMOD ==="

          KMOD="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              \( \
                -name 'kmod-amneziawg*.ipk' \
                -o -name 'kmod-amneziawg*.apk' \
              \) \
              | head -1
          )"

          if [ -z "$KMOD" ]; then
            echo "ERROR: kmod-amneziawg was not produced"
            exit 1
          fi

          echo "KMOD=$KMOD"

          echo
          echo "=== VERIFY TOOLS ==="

          TOOLS="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              \( \
                -name 'amneziawg-tools*.ipk' \
                -o -name 'amneziawg-tools*.apk' \
              \) \
              | head -1
          )"

          if [ -z "$TOOLS" ]; then
            echo "ERROR: amneziawg-tools was not produced"
            exit 1
          fi

          echo "TOOLS=$TOOLS"

          echo
          echo "=== VERIFY LUCI ==="

          LUCI="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              \( \
                -name 'luci-proto-amneziawg*.ipk' \
                -o -name 'luci-proto-amneziawg*.apk' \
              \) \
              | head -1
          )"

          if [ -z "$LUCI" ]; then
            echo "ERROR: luci-proto-amneziawg was not produced"
            exit 1
          fi

          echo "LUCI=$LUCI"

      # ------------------------------------------------------------
      # 15. Только диагностируем формат package-файлов.
      # Ничего через ar не распаковываем.
      # ------------------------------------------------------------
      - name: Inspect package files
        run: |
          set -eux

          echo "=== FILE TYPES ==="

          for pkg in artifacts/*
          do
            echo
            echo "----------------------------------------"
            echo "$pkg"
            echo "----------------------------------------"

            file "$pkg"

            sha256sum "$pkg"
          done

      # ------------------------------------------------------------
      # 16. Ищем собранный .ko отдельно.
      # Это важная дополнительная проверка kernel-module.
      # ------------------------------------------------------------
      - name: Locate compiled kernel module
        run: |
          set -eux

          echo "=== AMNEZIAWG KO FILES ==="

          find sdk \
            -type f \
            \( \
              -name 'amneziawg.ko' \
              -o -name '*amneziawg*.ko' \
            \) \
            -print || true

          KO="$(
            find sdk \
              -type f \
              \( \
                -name 'amneziawg.ko' \
                -o -name '*amneziawg*.ko' \
              \) \
              | head -1
          )"

          if [ -n "$KO" ]; then
            echo
            echo "=== MODULE FILE ==="
            file "$KO"

            echo
            echo "=== MODULE SIZE ==="
            ls -lh "$KO"

            cp -v "$KO" artifacts/ || true
          else
            echo
            echo "WARNING: separate .ko file not found."
            echo "The kmod package itself was produced, so this is not fatal."
          fi

      # ------------------------------------------------------------
      # 17. Сохраняем точную информацию о сборке
      # ------------------------------------------------------------
      - name: Create build information
        run: |
          set -eux

          {
            echo "AmneziaWG build for ImmortalWrt"
            echo
            echo "ImmortalWrt release: $IMMORTAL_VERSION"
            echo "Target: $TARGET/$SUBTARGET"
            echo
            echo "SDK:"
            echo "$SDK_FILE"
            echo
            echo "SDK SHA256:"
            echo "$SDK_SHA256"
            echo
            echo "AWG upstream repository:"
            echo "$AWG_REPO"
            echo
            echo "AWG upstream commit:"
            cat awg-upstream-commit.txt
            echo
            echo "Build date UTC:"
            date -u
          } > artifacts/BUILD-INFO.txt

          echo
          echo "=== BUILD INFO ==="

          cat artifacts/BUILD-INFO.txt

      # ------------------------------------------------------------
      # 18. Финальный список
      # ------------------------------------------------------------
      - name: Final artifact list
        run: |
          set -eux

          echo "=========================================="
          echo "        BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo

          ls -lah artifacts

          echo
          echo "=== SHA256 ==="

          find artifacts \
            -maxdepth 1 \
            -type f \
            ! -name 'SHA256SUMS' \
            -exec sha256sum {} \; \
            > artifacts/SHA256SUMS

          cat artifacts/SHA256SUMS

      # ------------------------------------------------------------
      # 19. Публикуем результат в GitHub Actions
      # ------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-immortalwrt-24.10.6-rockchip-armv8
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
